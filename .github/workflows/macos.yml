name: Build native macOS apps
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  user-app:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal user app and verify its model
        env:
          BUILD_INPUT_LAB: '0'
        run: bash macos/build.sh
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify Mac and Windows session protocol interoperability
        shell: bash
        run: |
          dotnet build src/TinyTask.SessionServer -o dist/session-server
          dotnet build tests/MixedSessionPeer -o dist/session-peer
          dotnet dist/session-server/TinyTask.SessionServer.dll --urls http://127.0.0.1:18763 --DataDirectory "$RUNNER_TEMP/session-test" > dist/session-server.log 2>&1 &
          server=$!
          trap 'cat dist/session-peer.log dist/session-server.log 2>/dev/null || true; kill "$server" ${peer:-} 2>/dev/null || true' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:18763/health && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:18763/health
          dotnet dist/session-peer/MixedSessionPeer.dll > dist/session-peer.log 2>&1 &
          peer=$!
          xcrun swiftc -swift-version 5 -framework AppKit -framework ApplicationServices macos/ClassicEngine.swift macos/SessionConnection.swift macos/SessionChecks.swift -o dist/session-checks
          dist/session-checks
          wait "$peer"
          cat dist/session-peer.log
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTask2-macOS-user
          path: |
            dist/macOS/TinyTask 2.0.zip
            dist/macOS/classic-self-test.json
            dist/macOS/user-ui-*.png
  tester-app:
    runs-on: macos-14
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build both native apps
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TinyTask2-macOS-inputlab
          path: dist/macOS/TinyTask 2.0 Input Lab.zip
